<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Breuken App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #1f4e79;
    }

    .app {
      background: white;
      max-width: 700px;
      margin: auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    select, button {
      font-size: 18px;
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
    }

    .fraction {
      font-size: 40px;
      font-weight: bold;
      margin: 20px;
      color: #d97706;
    }

    .bar {
      display: flex;
      width: 500px;
      height: 60px;
      margin: 25px auto;
      border: 3px solid #333;
      border-radius: 10px;
      overflow: hidden;
    }

    .part {
      flex: 1;
      border-right: 1px solid #333;
      background: #e5e7eb;
    }

    .part:last-child {
      border-right: none;
    }

    .filled {
      background: #f59e0b;
    }

    .circle {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      margin: 25px auto;
      background: conic-gradient(#f59e0b 0deg, #e5e7eb 0deg);
      border: 3px solid #333;
    }

    .explanation {
      font-size: 22px;
      margin-top: 20px;
      color: #333;
    }

    .small {
      color: #666;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="app">
    <h1>Breuken App</h1>
    <p class="small">Created by Huisman-AI</p>

    <label>Kies de teller:</label>
    <select id="numerator"></select>

    <label>Kies de noemer:</label>
    <select id="denominator"></select>

    <button onclick="showFraction()">Laat breuk zien</button>

    <div class="fraction" id="fractionText">1/2</div>

    <div class="bar" id="bar"></div>

    <div class="circle" id="circle"></div>

    <div class="explanation" id="explanation"></div>
  </div>

  <script>
    const numeratorSelect = document.getElementById("numerator");
    const denominatorSelect = document.getElementById("denominator");

    for (let i = 1; i <= 10; i++) {
      numeratorSelect.innerHTML += `<option value="${i}">${i}</option>`;
      denominatorSelect.innerHTML += `<option value="${i}">${i}</option>`;
    }

    numeratorSelect.value = 1;
    denominatorSelect.value = 2;

    function gcd(a, b) {
      while (b !== 0) {
        let temp = b;
        b = a % b;
        a = temp;
      }
      return a;
    }

    function showFraction() {
      let numerator = parseInt(numeratorSelect.value);
      let denominator = parseInt(denominatorSelect.value);

      if (numerator > denominator) {
        document.getElementById("explanation").innerHTML =
          "De teller mag in deze oefening niet groter zijn dan de noemer.";
        return;
      }

      document.getElementById("fractionText").innerText =
        numerator + "/" + denominator;

      const bar = document.getElementById("bar");
      bar.innerHTML = "";

      for (let i = 1; i <= denominator; i++) {
        const part = document.createElement("div");
        part.className = "part";
        if (i <= numerator) {
          part.classList.add("filled");
        }
        bar.appendChild(part);
      }

      const percentage = numerator / denominator;
      const degrees = percentage * 360;

      document.getElementById("circle").style.background =
        `conic-gradient(#f59e0b 0deg ${degrees}deg, #e5e7eb ${degrees}deg 360deg)`;

      const divisor = gcd(numerator, denominator);
      const simpleNumerator = numerator / divisor;
      const simpleDenominator = denominator / divisor;

      let explanation = `Je ziet hier ${numerator} van de ${denominator} gelijke delen.`;

      if (divisor > 1) {
        explanation += `<br>Deze breuk kun je vereenvoudigen naar 
        <strong>${simpleNumerator}/${simpleDenominator}</strong>.`;
      } else {
        explanation += `<br>Deze breuk is al zo eenvoudig mogelijk.`;
      }

      if (numerator === denominator) {
        explanation += `<br><strong>${numerator}/${denominator} is hetzelfde als 1 geheel.</strong>`;
      }

      document.getElementById("explanation").innerHTML = explanation;
    }

    showFraction();
  </script>

</body>
</html>
